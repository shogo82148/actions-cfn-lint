name: release
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled

jobs:
  release:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Release tags must be reachable from HEAD because the bump comment uses `git tag --merged`:
      # https://github.com/haya14busa/bump/blob/9ab5412f5d96eb624c7e8559acbb11330be9901a/main.go#L72
      - name: checkout to release branch
        run: |
          MAJOR=$(cat .major-version)
          if git rev-parse --verify --quiet "refs/remotes/origin/releases/$MAJOR" > /dev/null; then
            git checkout -b "releases/$MAJOR" "origin/releases/$MAJOR"
          else
            echo "::notice::origin/releases/$MAJOR does not exist. Use the current HEAD instead."
          fi

      # Bump version on merging Pull Requests with specific labels.
      # (bump:major,bump:minor,bump:patch)
      - id: bumpr
        uses: haya14busa/action-bumpr@v1.11.4
        with:
          dry_run: true

      - name: Set up QEMU for ARM Emulation
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # build the Docker Image
      - name: build the Docker Image
        id: build
        if: "!steps.bumpr.outputs.skip"
        run: |
          git switch main

          # Login to GHCR
          printenv GITHUB_TOKEN | docker login ghcr.io --username "${GITHUB_REPOSITORY%/*}" --password-stdin

          # Build and push multi-platform image
          docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "ghcr.io/$GITHUB_REPOSITORY:$TAG" \
              --push \
              .
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY:$TAG" --format "{{json .Manifest}}" | jq -r '.digest')
          docker logout ghcr.io

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bumpr.outputs.next_version }}

      # update the major version if major version is bumped
      - name: update major version
        id: update-major-version
        if: "!steps.bumpr.outputs.skip"
        run: |
          MAJOR="${TAG%%.*}" # v1
          echo "$MAJOR" > .major-version
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.bumpr.outputs.next_version }}
      - uses: shogo82148/actions-commit@v1.3.0
        if: "!steps.bumpr.outputs.skip"
        with:
          base-branch: main
          commit-message: "bump major version to ${{ steps.update-major-version.outputs.major }}"

      # merge main branch to release branch
      - name: merge main to release branch
        if: "!steps.bumpr.outputs.skip"
        run: |
          MAJOR=$(cat .major-version)
          git switch "releases/$MAJOR" || git switch -c "releases/$MAJOR"
          git merge -X theirs --no-ff --no-commit main
      - uses: shogo82148/actions-commit@v1.3.0
        if: "!steps.bumpr.outputs.skip"
        with:
          base-branch: "releases/${{ steps.update-major-version.outputs.major }}"

      # configure to use the pre-built image
      - name: configure Docker to use pre-built image
        if: "!steps.bumpr.outputs.skip"
        run: |
          git checkout main -- action.yml
          perl -i -pe "s(image:\\s*[\"']?Dockerfile[\"']?)(image: 'docker://ghcr.io/$GITHUB_REPOSITORY:$TAG\\@$DIGEST')" action.yml
        env:
          TAG: ${{ steps.bumpr.outputs.next_version }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: shogo82148/actions-commit@v1.3.0
        if: "!steps.bumpr.outputs.skip"
        with:
          base-branch: "releases/${{ steps.update-major-version.outputs.major }}"
          commit-message: "bump ${{ steps.bumpr.outputs.next_version }}"

      # Update MAJOR/MINOR tags
      - name: update MAJOR/MINOR tags
        if: "!steps.bumpr.outputs.skip"
        run: |
          MINOR="${TAG%.*}"   # v1.2
          MAJOR="${MINOR%.*}" # v1
          git tag -f "$MINOR"
          git tag -f "$MAJOR"
          git push origin "$MINOR" --force
          git push origin "$MAJOR" --force
        env:
          TAG: ${{ steps.bumpr.outputs.next_version }}

      # Create release.
      - uses: shogo82148/actions-create-release@v1.9.3
        if: "!steps.bumpr.outputs.skip"
        with:
          tag_name: ${{ steps.bumpr.outputs.next_version }}
          release_name: Release ${{ steps.bumpr.outputs.next_version }}
          generate_release_notes: true

  release-check:
    if: "github.event.action == 'labeled'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Release tags must be reachable from HEAD because the bump comment uses `git tag --merged`:
      # https://github.com/haya14busa/bump/blob/9ab5412f5d96eb624c7e8559acbb11330be9901a/main.go#L72
      - name: checkout to release branch
        run: |
          MAJOR=$(cat .major-version)
          if git rev-parse --verify --quiet "refs/remotes/origin/releases/$MAJOR" > /dev/null; then
            git checkout -b "releases/$MAJOR" "origin/releases/$MAJOR"
          else
            echo "::notice::origin/releases/$MAJOR does not exist. Use the current HEAD instead."
          fi

      - name: Post bumpr status comment
        uses: haya14busa/action-bumpr@v1.11.4
