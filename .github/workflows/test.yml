name: test

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: example cfn_lint_args
        uses: ./
        with:
          tool_name: cfn-lint with args
          filter_mode: nofilter
          cfn_lint_args: testdata/template.yaml
          level: info

      - name: example working_directory
        uses: ./
        with:
          tool_name: cfn-lint with args
          filter_mode: nofilter
          level: info
          working_directory: testdata

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU for ARM Emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build the Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "action-cfn-lint:$(date +%s)" \
            .
